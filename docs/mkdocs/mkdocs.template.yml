            "Модуль хөгжүүлэх заавар": "Module authoring guide"
            "Апп сторын ажиллагаа": "App store operations"
            "Хувилбар гаргах": "Releasing"
            "Орчуулгын гарын авлага": "Translation guide"
            "Төрийн үйлчилгээний урсгал": "Government services workflow"
