markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  # Кирилл гарчгийн anchor ажиллахын тулд unicode-ийг хадгалдаг slugify хэрэгтэй.
  # Python-Markdown-ийн стандарт slugify нь ASCII бус тэмдэгтийг хаядаг тул
  # «## Танилт» → хоосон id болж, хуудас доторх холбоос унадаг.
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gerege-systems/open-gerege-nexus
    - icon: material/book-open-variant
      link: https://docs.gerege.mn
    - icon: material/web
      link: https://nexus.gerege.mn

