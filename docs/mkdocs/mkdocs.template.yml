            "Архитектур": "Architecture"
            "Хөгжүүлэлт": "Development"
            "Модулиуд": "Modules"
            "Ажиллагаа": "Operations"
            "Native клиентүүд": "Native clients"
            "Төслийн журам": "Project policy"
            "Тойм": "Overview"
