services:
  postgres:
    image: postgres:16-alpine
    container_name: gerege_nexus_postgres
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      # Matches .env.example and the Makefile DATABASE_URL default.
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-31Z
    container_name: gerege_nexus_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot goose migration runner. Without this the API starts against an
  # empty database and every query fails with "relation does not exist".
  redis:
    image: redis:7-alpine
    container_name: gerege_nexus_dev_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gerege_nexus_migrate
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gerege_nexus_backend
    environment:
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/platform_db?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: 8080
      ENVIRONMENT: development
      PUBLIC_ORIGIN: http://nexus.localhost:3000
      ALLOWED_ORIGINS: http://nexus.localhost:3000,http://admin.localhost:3000
      CONTROL_PLANE_HOST: admin.localhost
      # The same name the frontend service is given below. The API uses it in
      # the sentence it shows when linking an eID identity fails and as the
      # relying-party name eID puts in front of a citizen.
      BRAND_NAME: ${BRAND_NAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_VOICE: ${GEMINI_VOICE:-Kore}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time — passing it only as a
        # runtime env var leaves the bundle pointing at the default URL.
        NEXT_PUBLIC_API_URL: http://nexus.localhost:8080/api/v1
        NEXT_PUBLIC_CONTROL_PLANE_API_URL: http://admin.localhost:8080/api/platform/v1
    container_name: gerege_nexus_frontend
    # The brand is read per request, so unlike the line above it needs no
    # rebuild to try: `BRAND_NAME="Something Else" docker compose up frontend`.
    environment:
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      # Wording a deployment says differently; see brand/README.md.
      BRAND_COPY_FILE: ${BRAND_COPY_FILE:-}
      BRAND_COPY: ${BRAND_COPY:-}
      CONTROL_PLANE_HOST: admin.localhost
    volumes:
      - ./brand:/brand:ro
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
