name: Docs

# Publishes docs/site to GitHub Pages.
#
# The site is generated from the Markdown already in this repository, so a
# documentation change is a Markdown change and nothing else — editing a
# document on the default branch is all it takes to update the published site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - name: Install
        working-directory: docs/site
        run: npm ci
      - name: Build
        working-directory: docs/site
        run: npm run build
      # A link that 404s is the one defect a documentation site cannot survive,
      # and it is cheap to prove absent before publishing rather than after.
      - name: Check links
        working-directory: docs/site
        run: node check-links.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    name: Deploy
    # Pull requests build and link-check, but only the default branch publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
