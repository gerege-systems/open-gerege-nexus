# Энэ репогийн native клиентүүд компайл хийгдэж байгаа эсэх.
#
# Гурван клиент, нэг гэр бүл: macOS (SwiftUI), iOS/iPadOS (мак-тай эх кодоо
# ХУВААЛЦДАГ), Android (Compose, өнгө/орчуулгаа мак-аас ҮҮСГЭДЭГ). Тиймээс
# ширээний нэг файл эвдэрвэл утасны build ч улаан болно — тэр нь зөв дохио.
#
# Windows клиент гурван distribution хэлбэрээр ижил solution-ийг компайлдана.
# Job нэрүүд (`macos`, `windows (…)`, `android`) нь main branch protection-д
# required check болсон тул нэрийг нь workflow-оос салгаж өөрчилж болохгүй.
#
# pull_request дээр path шүүлтгүй ажиллаж байгаа нь санаатай. Шаардлагатай
# шалгалт (required check) нь path-аар шүүгдсэн бол шүүлтэд таараагүй PR дээр
# ХЭЗЭЭ Ч мэдээлдэггүй, тэгээд backend-ийн PR бүр хэзээ ч ажиллахгүй job-ыг
# хүлээнэ. Энэ репод яг тэр болж, main нь Android дээр эвдэрсэн хэвээр үлдсэн.
name: Native clients

on:
  push:
    branches: [main]
    paths:
      - "native-apps/**"
      - ".github/workflows/native-clients.yml"
      - "scripts/check-native-tests.mjs"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Тесттэй клиент тестээ гүйцэтгэдэг эсэх. Windows тал таван тест файлтай
  # атлаа `dotnet build` дээр зогсдог байсан бөгөөд тэдгээр нь бичигдсэн
  # өдрөөсөө 2026-09-05 хүртэл нэг ч удаа гүйгээгүй — sln-д орсон тул
  # компайл хийгддэг, ногоон тэмдэг нь «энэ компайл хийгдэж байна» гэсэн
  # утгатай байв. Тестгүй клиент нь скрипт доторх жагсаалтад шалтгаанаа
  # бичүүлнэ: тестгүй байх нь байр суурь байж болно, түүнийг ЧИМЭЭГҮЙ
  # барих нь болохгүй.
  guard:
    name: Every client with tests runs them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-native-tests.mjs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      # Ширээний бүрхүүл ба түүний токен сан.
      - run: swift test
        working-directory: native-apps/desktop/gerege-token-kit
      - run: ./build.sh
        working-directory: native-apps/desktop/macos
      # Утасны клиент — ижил эх файлуудыг iOS дээр компайл хийж байгааг шалгана.
      - run: ./build.sh
        working-directory: native-apps/mobile/ios

  windows:
    strategy:
      matrix:
        form_factor: [Desktop, Kiosk, POS]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet build NexusGeregeDesktop.sln --configuration Release -p:FormFactor=${{ matrix.form_factor }} -p:RestoreLockedMode=false
        working-directory: native-apps/desktop/windows
      # `dotnet build` компайл хийгээд зогсдог тул `tests/` доторх таван багц —
      # SPKI pin validator, HMAC signer, sensitive-action guard, гэрчилгээний
      # үйлчилгээ, esign тохиргоо — бичигдсэн өдрөөсөө хойш нэг ч удаа
      # ажиллаагүй. Pin шалгагчийн логик эвдэрсэн ч энэ workflow ногоон
      # хэвээр байх байсан: тест байхгүй ба тест ногоон хоёрыг ялгах зүйл
      # энэ мөр.
      - run: dotnet test NexusGeregeDesktop.sln --configuration Release -p:FormFactor=${{ matrix.form_factor }} -p:RestoreLockedMode=false
        working-directory: native-apps/desktop/windows

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # Үүсгэсэн өнгө/орчуулга нь эх сурвалжтайгаа ТААРЧ байгаа эсэх: скриптийг
      # дахин ажиллуулаад ялгаа гарвал хэн нэгэн гаралтыг гараар зассан эсвэл
      # ширээний токен өөрчлөгдөөд энд дагаагүй гэсэн үг.
      - run: python3 scripts/gen_from_swift.py
        working-directory: native-apps/mobile/android
      - run: git diff --exit-code -- native-apps/mobile/android
      - run: ./gradlew test assembleDebug
        working-directory: native-apps/mobile/android
