name: Native clients

on:
  push:
    branches: [main]
    paths: ["native-apps/**", ".github/workflows/native-clients.yml"]
  # Deliberately unfiltered, unlike the push trigger above.
  #
  # These jobs are what actually compile the four clients, and on 2026-08-12
  # they were advisory: a pull request merged with `android` red because branch
  # protection required only Lint and Test, and main stopped building for
  # Android until a follow-up landed. The fix is to make them required — and a
  # required check that is path-filtered never reports on a pull request that
  # misses the filter, so every backend-only change would wait for a job that
  # is never going to run. Running them on every pull request is the price of
  # having them gate anything at all.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build.sh
        working-directory: native-apps/macos
      - run: swift test
        working-directory: native-apps/ios
      - run: xcodebuild -quiet -project GeregeNexusIOS.xcodeproj -scheme GeregeNexusIOS -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
        working-directory: native-apps/ios
  windows:
    strategy:
      matrix:
        form_factor: [Desktop, Kiosk, POS]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet build GeregeNexusWin.csproj --configuration Release -p:FormFactor=${{ matrix.form_factor }}
        working-directory: native-apps/windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :core:test :app:compileMobileDebugKotlin :app:compileTabletDebugKotlin :app:compileKioskDebugKotlin :app:compilePosDebugKotlin
        working-directory: native-apps/android
