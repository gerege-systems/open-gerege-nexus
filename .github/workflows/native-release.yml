name: Native release artifacts
on:
  push:
    tags: ["native-v*"]
permissions: { contents: read }

# Гарын үсэг ЗУРААГҮЙ артефактууд. Гурван клиент нэг гэр бүл боловч сав нь
# өөр: macOS нь .app, Android нь .apk, Windows нь single-file .exe.
jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      # build.sh нь DerivedData руу бичдэг тул артефакт цуглуулахын тулд энд
      # xcodebuild-ыг шууд дуудаж гаралтын замыг тогтооно.
      - run: xcodegen generate
        working-directory: native-apps/desktop/macos
      - run: >-
          xcodebuild -project NexusGeregeDesktop.xcodeproj -scheme NexusGeregeDesktop
          -configuration Release -destination 'platform=macOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: native-apps/desktop/macos
      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-unsigned
          path: native-apps/desktop/macos/build/Build/Products/Release/NexusGeregeDesktop.app
      - run: CONFIGURATION=Release DESTINATION='generic/platform=iOS' ./build.sh
        working-directory: native-apps/mobile/ios

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew :app:assembleRelease
        working-directory: native-apps/mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: native-apps/mobile/android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 8.0.x }
      - run: dotnet publish src/NexusGeregeDesktop.Client/NexusGeregeDesktop.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
        working-directory: native-apps/desktop/windows
      - uses: actions/upload-artifact@v7
        with:
          name: windows-win-x64
          path: native-apps/desktop/windows/src/NexusGeregeDesktop.Client/bin/Release/net8.0-windows*/win-x64/publish
