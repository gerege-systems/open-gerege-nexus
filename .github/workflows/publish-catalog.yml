name: Publish catalogue

# What this does, and what it deliberately does not.
#
# A first-party module's version is decided by a merge. Asking somebody to
# retype it into the publishing console afterwards is how a catalogue falls
# behind the code it describes — and the drift is silent, because a stale
# catalogue looks exactly like a current one from every screen.
#
# So this submits the manifests this build carries, chronicle entries and all.
# The registry puts them in_review like every other submission. It cannot
# publish them: the token it holds reaches one endpoint, and publishing stays a
# human decision in the review queue. A pipeline that could publish its own
# submissions would be a queue nobody reads.
#
# It runs on a tag rather than on every push to main, because a catalogue entry
# is a claim about a release. Running per-commit would fill the queue with
# versions that were never released.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be submitted and send nothing"
        type: boolean
        default: true
      only:
        description: "Comma-separated slugs (default: everything this repository publishes)"
        required: false

permissions:
  contents: read

concurrency:
  # Two runs submitting the same versions would race on the same rows. The
  # second is not cancelled — it is the one carrying the newer tag.
  group: publish-catalog
  cancel-in-progress: false

jobs:
  submit:
    name: Submit to the registry
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The catalogue is loaded through the same code the server uses, so a
      # manifest this submits is one an instance would accept. A dry run needs
      # no secret and is what a fork or a pull request gets.
      - name: Check the catalogue loads
        run: go run ./cmd/publish-catalog -dry-run -catalog ../catalog/apps.json

      - name: Submit
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          APPSTORE_PUBLISH_TOKEN: ${{ secrets.APPSTORE_PUBLISH_TOKEN }}
          APP_CATALOG_REGISTRY: ${{ vars.APP_CATALOG_REGISTRY || 'https://appstore.gerege.mn' }}
        run: |
          if [ -z "$APPSTORE_PUBLISH_TOKEN" ]; then
            echo "::error::APPSTORE_PUBLISH_TOKEN is not set; the catalogue was not submitted"
            exit 1
          fi
          go run ./cmd/publish-catalog \
            -registry "$APP_CATALOG_REGISTRY" \
            -catalog ../catalog/apps.json \
            ${{ inputs.only && format('-only {0}', inputs.only) || '' }}

      - name: Say what happens next
        if: success() && (github.event_name == 'push' || inputs.dry_run == false)
        run: |
          echo "### Submitted to the review queue" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing is published yet. A reviewer publishes from" \
               "developer.gerege.mn/review, and instances pick it up on their" \
               "next sync." >> "$GITHUB_STEP_SUMMARY"
