# Does this change break a product built on the platform?
#
# pkg/nexus/testdata/api.txt records the exported surface, and its header says
# why: a contract is broken by renaming a parameter during a refactor, not by
# anybody deciding to break it. But a golden file holds signatures and nothing
# else. Every one of these keeps api.txt green and breaks a distribution:
#
#   * a method whose signature is unchanged and whose answer is not
#   * Capability returning a zero value instead of an error
#   * a sink called in a different order, or not at all
#   * a registration that no longer takes effect
#
# The only thing that catches those is compiling and running real code against
# the contract. That code is backend/testdata/canary, and it is in this
# repository.
#
#
# It used to be somebody else's repository, and that was the wrong direction.
#
# A second job cloned business-gerege-nexus — a real product, four modules — and
# built it against the commit under review. It caught real breakage, and it
# caught it at a price this pipeline should not pay: the platform could not
# merge until a repository the platform does not own had been updated and
# pushed. On 2026-08-27 that arrived as designed. `pkg/nexus`'s `tenant*` names
# became `workspace*` — a deliberate major-version rename, written down in
# docs/MODULES.md with the table of what a caller changes — and the job
# reported it as a failure, because a job that compiles a pinned downstream has
# no way to be told that a break is the point.
#
# A gate that cannot distinguish an intended break from an accident is a gate
# people learn to merge past, and then it is worth nothing on the day it is
# right. So the coverage moved instead of the standard: the canary in this
# repository now exercises the request-scoped surface the clone was catching —
# RequireWorkspace, UserFromContext, WorkspaceOf — and it is edited in the same
# pull request as the change, by the person making it, which is what the
# failure message asked for anyway.
#
# What is genuinely lost: nobody else's four modules are compiled here, so a
# behaviour change that only their shape reveals now surfaces when they upgrade.
# The answer to that is the version number — a major says "read the release
# note" — not a build of theirs on our critical path.
name: Downstream

on:
  pull_request:
  push:
    branches: [main]

jobs:
  minimal:
    name: Minimal distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # backend/testdata/canary is a distribution written in this repository,
      # and it is here because the real one does not reach far enough: it was
      # written before Provide, Capability, Migrations, ProvideAssistant and
      # DefaultRoles existed and touches none of them. Those are precisely the
      # surfaces a behaviour change would break unnoticed — nothing outside this
      # repository compiles against them yet.
      - name: Build and test the minimal distribution
        id: minimal
        working-directory: backend/testdata/canary
        run: go build ./... && go vet ./... && go test ./...

      - if: failure() && steps.minimal.outcome == 'failure'
        run: |
          echo "::error::backend/testdata/canary does not build or pass its tests against this commit."
          echo "::error::It uses the SDK the way a distribution does. If the change is deliberate, change the canary in the same pull request and say in the description what a caller has to do."
