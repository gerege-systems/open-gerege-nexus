name: Security

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    # The Go module lives in backend/. Running from the repository root
    # aborts with "go.mod file not found".
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Static Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # gosec catches a different class of issues than govulncheck:
      # govulncheck reads vuln DB → flags vulnerable deps; gosec reads
      # source → flags antipatterns (hardcoded creds, weak crypto,
      # SQL injection patterns, unsafe file perms, etc.).
      #
      # Built from source with the toolchain setup-go just installed, rather
      # than run from the published action's container. That container carries
      # its own older Go, which could not import pgx from a module targeting a
      # newer language version — so the scan reported "Issues: 0" and then
      # exited non-zero on the compile errors, which is a red security scan
      # that has found nothing and a habit of ignoring it. The lint job in
      # ci.yml uses install-mode: goinstall for exactly this reason.
      #
      # The version is pinned so a scan does not start failing on somebody
      # else's release.
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.8
      - name: Run gosec
        working-directory: backend
        # G104 (errcheck) is noisy and golangci-lint already covers it.
        # G404 (math/rand) is only used for circuit-breaker jitter — never
        # for tokens or secrets, which use crypto/rand.
        run: gosec -exclude=G104,G404 ./...
