name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Single source of truth for the toolchain: backend/go.mod.
          # Pinning "1.24" here while go.mod requires 1.25.7 breaks every job.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6
          working-directory: backend
          # The published binaries are built with Go 1.24 and refuse to analyse
          # a module targeting a newer language version:
          #   "the Go language version (go1.24) used to build golangci-lint is
          #    lower than the targeted Go version (1.25.x)".
          # Compiling from source with the toolchain from setup-go keeps the two
          # in step automatically.
          install-mode: goinstall
          # The analysis cache is not trustworthy here, so it is not kept.
          #
          # On 2026-08-12 a restored cache produced six SA5011 findings —
          # "possible nil pointer dereference" on three test files that guard
          # with `if x == nil { t.Fatalf(...) }` before dereferencing, which is
          # the correct pattern and has been in the tree for days. staticcheck
          # only knows that `t.Fatalf` does not return if it holds that fact
          # about the testing package; the cached run did not, so it reported a
          # dereference after a check it could not see was terminating.
          #
          # It was reproducible from the cache and not otherwise: the same
          # commit, the same golangci-lint v2.1.6 built with the same Go, run
          # with a cold cache on Linux and on macOS, reports zero issues. It
          # survived a re-run, because the re-run restored the same cache. A
          # dependency change had rotated the cache key shortly before, so the
          # poisoned entry was written once and then served to everything after
          # it.
          #
          # A lint that reports six failures on unchanged, correct code — and
          # keeps reporting them until somebody notices the cache — is worse
          # than a lint that takes another minute. The cost is about a minute
          # per run.
          skip-cache: true

      - name: Fail if the domain imports the platform
        working-directory: backend
        # backend/domain holds the apps' rules with nothing of this deployment
        # in them: no internal/, no pkg/nexus. backend/domain/boundaries_test.go
        # asserts the same thing and is the better error message — it names the
        # package and says why the rule exists.
        #
        # This is here anyway because the two measure different things. The test
        # reads direct imports, which is what a person writes; these lines read
        # the whole transitive graph, which is what the module actually carries.
        # A domain package that imports a harmless-looking helper which itself
        # reaches into internal/ passes the test and fails here, and that is the
        # version of the mistake nobody would have found by reading.
        run: |
          if go list -deps ./domain/... | grep -q 'open-gerege-nexus/backend/internal'; then
            echo "::error::the domain reaches the platform — go list -deps ./domain/... contains backend/internal"
            go list -deps ./domain/... | grep 'open-gerege-nexus/backend/internal'
            exit 1
          fi
          if go list -deps ./domain/... | grep -q 'open-gerege-nexus/backend/pkg/nexus'; then
            echo "::error::the domain reaches the SDK — go list -deps ./domain/... contains pkg/nexus"
            go list -deps ./domain/... | grep 'open-gerege-nexus/backend/pkg/nexus'
            exit 1
          fi

      - name: Test deployment safety helpers
        run: python3 -m unittest discover -s deploy/scripts -p 'test_*.py'

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Several packages hold their invariants partly in SQL — composite tenant
    # foreign keys, immutability triggers, optimistic concurrency on
    # row_version — so their integration tests need a real schema. Without a
    # database they self-skip, which used to leave whole suites green without
    # ever running.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Cross-replica cache invalidation and the shared rate-limit counters are
      # the two things that cannot be tested in one process. Without this the
      # tests that cover them self-skip, which is how a coordination bug ships.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      DOCUMENTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      EMAILVERIFY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      # Single-use code redemption and refresh rotation are enforced by SQL
      # predicates, not by Go, so the OAuth2 flow tests need a real schema.
      OAUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      # Tenant row-level isolation, the permission cache and the session idle
      # timeout are all database behaviour, and all self-skip without this.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      # The login lockout — the threshold, the window, and the restart after a
      # lapsed lock — is decided entirely by one SQL statement, so its tests
      # need a real schema too.
      AUTH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      # Reporting: a report reads inside the caller's tenant binding, and a
      # cross-tenant grant is a row-level policy plus a partial unique index.
      # Every claim in those tests is a claim about what PostgreSQL does.
      REPORTING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      AUDIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/platform_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: Migrate the test database
        run: go run ./cmd/migrate up
      - name: Run tests
        run: go test -race ./...
      # A guard step of this shape belongs to the package it names, and has to
      # leave with it. The gov_services one outlived its package: the app moved
      # to gerege-gov, `./internal/apps/gov_services/...` matched nothing, and
      # `go test` over no packages is a pass — so the step written to stop a
      # silent skip became one. Removing a package means removing its step.
      - name: Fail if the email verification integration tests were skipped
        # Same reasoning again: a confirmation is claimed by one conditional
        # UPDATE, and a skipped test is how that stops being true without
        # anybody noticing.
        run: |
          go test -run 'TestAReturnIsGoodExactlyOnce' -v ./internal/workspace/emailverify/... \
            | tee /tmp/emailverify.log
          if grep -q -- '--- SKIP' /tmp/emailverify.log; then
            echo "::error::email verification integration tests skipped — EMAILVERIFY_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the OAuth2 flow tests were skipped
        # An authorization code is spent by an UPDATE predicate and a refresh
        # token family is revoked by another, so the properties that make the
        # provider safe to expose — single use, rotation, replay detection —
        # are not observable without a database. Skipped, every one of them
        # reports green having asserted nothing.
        run: |
          go test -run 'TestAuthorizationCodeCannotBeUsedTwice|TestRefreshTokenRotation|TestConcurrentRefreshRevokesFamily' -v \
            ./internal/workspace/ssoprovider/... | tee /tmp/oauth.log
          if grep -q -- '--- SKIP' /tmp/oauth.log; then
            echo "::error::OAuth2 flow tests skipped — OAUTH_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi

      - name: Fail if the seeded-role tests were skipped
        # What a brand-new organisation's manager and user can do is decided by
        # a trigger, not by Go, so nothing else observes it. It named five
        # permissions belonging to an app that left this repository; skipped,
        # a list like that can come back and no test would say so.
        run: |
          go test -run 'TestANewTenantsDefaultGrantsAreUnchanged' -v \
            ./db/migrations/ | tee /tmp/seedroles.log
          if grep -q -- '--- SKIP' /tmp/seedroles.log; then
            echo "::error::seeded-role tests skipped — TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the signing store tests were skipped
        # The e-signature app's isolation is in its WHERE clauses, its batch's
        # refusal is a subquery's row count, and its archive is a column rather
        # than a DELETE. Skipped, the package reports green having asserted
        # nothing about the one app whose output is evidence.
        run: |
          go test -run 'TestADocumentIsInvisibleToAnotherOrganisation' -v \
            ./internal/workspace/signing/ | tee /tmp/signing.log
          if grep -q -- '--- SKIP' /tmp/signing.log; then
            echo "::error::signing store tests skipped — no test database is reaching the test"
            exit 1
          fi
      - name: Fail if the route policy test was skipped
        # This is the one that decides whether a route is reachable by a
        # stranger. Modules are handed the root router, so mounting a path
        # outside the gate is one line; skipped, that line ships unnoticed.
        run: |
          go test -run 'TestEveryRouteIsGatedUnlessItIsOnThePublicList' -v \
            ./pkg/host/ | tee /tmp/routes.log
          if grep -q -- '--- SKIP' /tmp/routes.log; then
            echo "::error::route policy test skipped — AUTH_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the route table golden test was skipped
        # The golden file is the only thing that makes adding a route to the
        # core a visible act. It is built from the real router, so it needs the
        # real schema; skipped, the platform's surface can grow a line at a
        # time with nothing in a review saying so.
        run: |
          go test -run 'TestTheRouteTableIsTheOneOnRecord' -v \
            ./pkg/host/ | tee /tmp/routes_golden.log
          if grep -q -- '--- SKIP' /tmp/routes_golden.log; then
            echo "::error::route table golden test skipped — AUTH_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the capability wiring tests were skipped
        # The eight things Bootstrap needs used to be parameters, so a missing
        # one was a compile error. They are capabilities now and a missing one
        # is a log line and a zero value. These tests are that compile error put
        # back, and they need the real server to be built to run at all.
        run: |
          go test -run 'TestTheServerProvidesEverythingBootstrapAsksFor|TestABuiltServerProvidesTheBookingCapability' -v \
            ./internal/workspace/ | tee /tmp/capabilities.log
          if grep -q -- '--- SKIP' /tmp/capabilities.log; then
            echo "::error::capability wiring tests skipped — AUTH_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the login lockout tests were skipped
        # The lockout is one UPDATE. Whether a lapsed lock restarts the count or
        # adds to it is the difference between locking an account after five bad
        # passwords and locking it for good after five, and neither is visible
        # without a database.
        run: |
          go test -run 'TestLapsedLockoutDoesNotRelockOnASingleFailure' -v \
            ./internal/workspace/ | tee /tmp/lockout.log
          if grep -q -- '--- SKIP' /tmp/lockout.log; then
            echo "::error::login lockout tests skipped — AUTH_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the tenant isolation tests were skipped
        # This is the one that matters most. It is the test that proves a query
        # carrying no WHERE tenant_id returns only the caller's rows — the whole
        # point of the row-level policies. Skipped, the policies could stop
        # applying entirely and every other test would still be green.
        run: |
          go test -run 'TestQueryWithoutATenantClauseSeesOnlyItsOwnTenant' -v \
            ./internal/kernel/dbguard/... | tee /tmp/dbguard.log
          if grep -q -- '--- SKIP' /tmp/dbguard.log; then
            echo "::error::tenant isolation tests skipped — TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the module migration tests were skipped
        # A module bringing its own schema is the whole of Үе 3, and nothing
        # else exercises it: no app has moved out of db/migrations yet. Skipped,
        # the mechanism ships with no evidence it works.
        run: |
          go test -run 'TestAModuleBringsItsOwnSchemaAndItsOwnHistory' -v \
            ./internal/workspace/appinstall/ | tee /tmp/modmigrate.log
          if grep -q -- '--- SKIP' /tmp/modmigrate.log; then
            echo "::error::module migration tests skipped — TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the tenant policy shape test was skipped
        # Which tables a multi-organisation session can read across, and which
        # ones it cannot. Both shapes are correct somewhere and only one is
        # correct per table; skipped, a new table takes whichever its neighbour
        # had and nothing says so.
        run: |
          go test -run 'TestTenantPoliciesHaveTheShapeOnRecord' -v \
            ./db/migrations/ | tee /tmp/policyshape.log
          if grep -q -- '--- SKIP' /tmp/policyshape.log; then
            echo "::error::tenant policy shape test skipped — TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the reporting isolation tests were skipped
        # A report is a query somebody else wrote against tables the platform
        # keeps a tenant apart in. The test that matters proves a report which
        # forgot its WHERE tenant_id returns nothing rather than everyone's
        # rows — and it proves it only if a database is actually there.
        run: |
          go test -run 'TestAReportThatForgetsTheTenantClauseSeesNothingElse' -v \
            ./internal/workspace/reporting/... | tee /tmp/reporting.log
          if grep -q -- '--- SKIP' /tmp/reporting.log; then
            echo "::error::reporting isolation tests skipped — REPORTING_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the report sharing tests were skipped
        # The one place this platform deliberately lets one organisation see
        # another's figures. Default deny, immediate revocation, counterparty
        # scope and the two-sided audit are all enforced in SQL; skipped, the
        # whole mechanism could be inert and every other test would be green.
        run: |
          go test -run 'TestConsolidatedShowsNothingWithoutAGrant|TestRevokingAGrantClosesItAtOnce|TestCounterpartyScopeExcludesAnotherMinesRows|TestConsolidatedRunIsAuditedOnBothSides' -v \
            ./internal/workspace/reporting/... | tee /tmp/sharing.log
          if grep -q -- '--- SKIP' /tmp/sharing.log; then
            echo "::error::report sharing tests skipped — REPORTING_TEST_DATABASE_URL is not reaching the test"
            exit 1
          fi
      - name: Fail if the cross-replica tests were skipped
        # Invalidation reaching another replica, and two replicas sharing one
        # rate-limit budget, are both invisible to a single-process test.
        run: |
          go test -run 'TestAnInvalidationOnOneReplicaReachesAnother' -v \
            ./internal/kernel/cache/... | tee /tmp/cache.log
          go test -run 'TestTwoReplicasShareOneBudget' -v \
            ./internal/kernel/security/... | tee -a /tmp/cache.log
          if grep -q -- '--- SKIP' /tmp/cache.log; then
            echo "::error::cross-replica tests skipped — TEST_REDIS_URL is not reaching the test"
            exit 1
          fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Run frontend unit tests
        run: npm test
      # The service worker sits in front of every request the app makes, and
      # this platform's requests carry tenant data. It is written so that /api
      # is never cached; this asserts that rather than trusting a handful of
      # early returns to survive editing.
      - name: Check the service worker caches nothing personal
        run: npm run pwa:check
      # lib/api.ts was 1831 lines with every app's endpoints in one object, and
      # was the file app work changed most often. It is split now; this is what
      # keeps the core client from filling up again.
      - name: Check the core API client owns only core paths
        run: npm run api:check
      - name: Check the control-plane host serves no tenant screen
        run: npm run host:check
      # The native shells' home screens and the installed app's launcher
      # shortcuts are plain data, so nothing else checks them. Fourteen of
      # twenty-six tiles were left pointing at deleted pages once and the build
      # stayed green: a string is a string.
      - name: Check every shell link leads somewhere
        run: npm run links:check
      # Warning mode, deliberately. 257 keys per language are untranslated
      # today and this step is not the commit that fixes them — an untranslated
      # key falls back to English, which is right at runtime and invisible in
      # review. What it does catch as a failure is an orphaned translation and
      # one filed under the wrong app, both of which are mistakes rather than
      # backlog. The count is printed so it can be watched going the right way.
      # The sidebar's icon map is generated from the icons Go and the manifests
      # name. Out of date, a menu entry renders the fallback glyph — which is
      # the silent failure the hand-written map used to produce, arriving by a
      # different road.
      - name: Check the icon map is current
        run: npm run icons:generate -- --check
      - name: Report the translation backlog
        run: npm run i18n:check -- --warn
      - name: Build
        run: npm run build
      - name: Smoke-test the built host boundary
        run: npm run host:smoke

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build binaries
        working-directory: backend
        run: |
          go build -o bin/api ./cmd/api
          go build -o bin/migrate ./cmd/migrate

      - name: Build backend Docker image
        run: docker build -f deploy/Dockerfile -t open-gerege-nexus-backend:ci .
