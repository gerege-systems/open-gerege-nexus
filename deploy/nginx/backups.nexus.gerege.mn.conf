# backups.nexus.gerege.mn — the backup store's S3 endpoint.
#
# What is published here is the S3 API and a page that explains what the store
# is; MinIO's browser console
# stays on loopback (127.0.0.1:9003) for somebody with an SSH tunnel: it is a
# second login surface, nothing routine needs it, and the thing behind it is
# every deployment's data.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.nexus.gerege.mn DNS wildcard is not a certificate one:
#
#   cp deploy/nginx/backups.nexus.gerege.mn.conf /etc/nginx/sites-available/backups.nexus.gerege.mn
#   ln -s /etc/nginx/sites-available/backups.nexus.gerege.mn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d backups.nexus.gerege.mn
#
# Certbot rewrites this file in place. Do not hand-write the TLS block.

server {
    listen 80;
    server_name backups.nexus.gerege.mn;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. nginx 1.25.1-ээс хойш ийм
    # хэлбэрийг дэмждэг.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # A dump is one request. The default 1m body limit would refuse every
    # upload with a 413 that the S3 client reports as a generic failure.
    client_max_body_size 0;
    # And it is written straight through rather than spooled to this host's
    # disk first — the disk the backup exists to survive.
    proxy_request_buffering off;
    proxy_buffering off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The bare domain is two things at once, and the Authorization header is
    # what tells them apart. An S3 client signs every request, including
    # ListBuckets on `/`; a browser arriving to read about the backups signs
    # nothing. So an unsigned GET / gets the page and everything else — signed
    # or not, any other path — goes to MinIO untouched.
    #
    # The 418 is nginx's documented way of leaving a location from inside an
    # `if` without the two of them fighting: `if` may set the error, and the
    # named location does the proxying.
    location = / {
        error_page 418 = @minio;
        if ($http_authorization != "") { return 418; }
        if ($request_method != GET)    { return 418; }

        root /var/www/backups;
        try_files /index.html =404;
        # Богино кэш: энэ хуудас баримт бичиг шиг өөрчлөгддөг, зар сурталчилгаа шиг биш.
        add_header Cache-Control "public, max-age=60" always;
    }

    location @minio {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        # S3 signs the Host header. Rewriting it here invalidates every
        # signature and MinIO answers SignatureDoesNotMatch, which reads like a
        # wrong key rather than a proxy setting.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
