# Canonical control-plane API routes.
#
# deploy.yml includes this in the live TLS vhost. It is a snippet because
# certbot owns that vhost's TLS directives; replacing the whole file during a
# rollout would erase certificate changes made on the server.

location ~ ^/api/platform/v1/(session|step-up)$ {
    limit_req zone=cp_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/platform/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# One-release compatibility address. The API returns the guarded 308; nginx
# deliberately does not manufacture the redirect ahead of HostGate.
location /cp/api {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
