# Who may reach the operator console.
#
# Installed as /etc/nginx/snippets/cp-allowlist.conf and included at server
# level by admin.nexus.gerege.mn.conf. This copy is the shipped default and it
# denies everyone: a console that is reachable before anybody has decided who
# may reach it is the failure this file exists to prevent, so the version in
# the repository is the safe one and the deployment edits its own.
#
# Add the addresses your operators actually come from — the office's outbound
# address, the VPN's pool, a jump host — one `allow` per line, above the
# `deny all`. Order matters: nginx takes the first match.
#
#   allow 203.0.113.10;        # office
#   allow 198.51.100.0/24;     # VPN pool
#   allow 2001:db8::/32;       # the same, over IPv6
#
# Then:
#
#   nginx -t && systemctl reload nginx
#
# A refused caller gets 403 from nginx and never reaches the application, so
# nothing about the console — not its login screen, not its existence — is
# visible from an address that is not listed.
#
# If your operators do not have fixed addresses, this file is the wrong control
# and a VPN or an identity-aware proxy is the right one; do not weaken it to
# `allow all` and rely on the password. The console's own defences (a second
# factor on every sign-in, a thirty-minute idle timeout, step-up before
# anything dangerous) are designed to sit behind this, not instead of it.

deny all;
