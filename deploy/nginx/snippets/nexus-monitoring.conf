# Grafana and Alertmanager, behind the platform's own domain.
#
# Include from the vhost:
#
#   include snippets/nexus-monitoring.conf;
#
# Both containers publish on loopback only, so without this they are reachable
# from the server itself and from an SSH tunnel — which is a perfectly good
# answer for a small team, and the reason including this file is a decision
# rather than a default. Exposing them costs one more login surface on the
# public internet.
#
# What this does NOT expose: Prometheus (9091), Loki (3100), cAdvisor (8085)
# and every exporter. Prometheus has no authentication at all and its query API
# will happily describe the whole deployment to anyone who asks; Grafana is the
# only one of these designed to face a person.
#
# Grafana is told to serve from /grafana by GF_SERVER_ROOT_URL and
# GF_SERVER_SERVE_FROM_SUB_PATH in the monitoring compose file. Those two and
# the prefix here have to agree — change one and every link Grafana generates
# points somewhere that does not exist.

location /grafana/ {
    # No trailing slash on proxy_pass, deliberately. With one, nginx strips
    # the /grafana prefix before forwarding — and Grafana is started with
    # GF_SERVER_SERVE_FROM_SUB_PATH=true, so it expects to receive that
    # prefix and redirects anything else to its root URL. The two together
    # are an infinite redirect: /grafana/ → /grafana/ → /grafana/.
    proxy_pass http://127.0.0.1:3009;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Grafana's live tail and its dashboard refresh use websockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # A dashboard query over a wide range can take a while, and the default
    # 60s read timeout turns that into a 504 the user reads as "Grafana is
    # broken".
    proxy_read_timeout 300s;
}

