# bi.nexus.gerege.mn — дата агуулах, BI ба AI давхаргын зураглал.
#
# Ард нь deploy/docker-compose.bi.yml-ийн контейнер, зөвхөн loopback дээр.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.nexus.gerege.mn DNS wildcard is not a certificate one:
#
#   cp deploy/nginx/bi.nexus.gerege.mn.conf /etc/nginx/sites-available/bi.nexus.gerege.mn
#   ln -s /etc/nginx/sites-available/bi.nexus.gerege.mn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d bi.nexus.gerege.mn
#
# Certbot rewrites this file in place. Do not hand-write the TLS block.

server {
    listen 80;
    server_name bi.nexus.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Хуудас нь Google Fonts-оос хоёр stylesheet, гурван фонт татна. Өөр юу ч
    # биш: script нь хуудсан дотор, зураг байхгүй, гуравдагч этгээдийн
    # аналитик байхгүй. Тиймээс бодлого нь тэр гурвыг зөвшөөрөөд бусдыг хаана —
    # ирээдүйд хэн нэгэн мөрдөх код нэмвэл чимээгүй ажиллахгүй, эндээс л
    # зогсоно.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/html text/css application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Хуудас нэг файл бөгөөд агуулгын hash-гүй. Урт кэш өгвөл засвар
        # хийсний дараа хуучин хувилбар хүмүүсийн браузерт үлдэнэ; богино кэш
        # нь ачааллыг барьж, шинэчлэлтийг хэдэн минутын дотор хүргэнэ.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300" always;
    }
}
