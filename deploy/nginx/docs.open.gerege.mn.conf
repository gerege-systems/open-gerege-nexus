# docs.open.gerege.mn — баримт бичгийн сайт.
#
# Статик. MkDocs угсарсан модыг /var/www/docs дотор тавьна; энэ хост дээр
# ажиллах process байхгүй, сэргээх үед хийх зүйл нь файлуудаа буцааж тавих л
# явдал.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.open.gerege.mn DNS wildcard is not a certificate one:
#
#   cp deploy/nginx/docs.open.gerege.mn.conf /etc/nginx/sites-available/docs.open.gerege.mn
#   ln -s /etc/nginx/sites-available/docs.open.gerege.mn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d docs.open.gerege.mn

server {
    listen 80;
    server_name docs.open.gerege.mn;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. nginx 1.25.1-ээс хойш ийм
    # хэлбэрийг дэмждэг.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    root /var/www/docs;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # MkDocs нь use_directory_urls-тэй тул хаяг бүр хавтас: /monitoring/ →
    # /monitoring/index.html. Эцсийн `=404` нь чухал — түүнгүй бол байхгүй
    # хуудас нүүр хуудсыг 200-гаар буцааж, эвдэрсэн холбоос ажиллаж байгаа мэт
    # харагдана.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Хайлтын индекс болон assets нь агуулгын hash-гүй тул урт кэш өгөхгүй:
    # шинэ хувилбар гаргахад хуучин индекс үлдвэл хайлт байхгүй хуудас заана.
    location ~* \.(css|js|woff2?|svg|png|webp|jpg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}
