# Device domain lines — one host per FORM FACTOR, one backend behind them.
#
#   desktop.nexus.gerege.mn  macOS, Windows Desktop
#   mobile.nexus.gerege.mn   iOS / iPadOS, Android mobile / tablet
#   kiosk.nexus.gerege.mn    Kiosk (Windows, Android)
#   pos.nexus.gerege.mn      POS (Windows, Android)
#
# The host names the way a person holds the device, not the operating system:
# a Mac and a Windows box on the same desk are one line. Which client is
# actually running is a separate question, answered by window.GeregeShell.
# kiosk and pos stay apart because a Windows machine can run the desktop
# client and a kiosk at once, and those two need separate cookie jars.
#
# Upstreams are the SAME two nexus.gerege.mn uses: 3008 frontend, 8082 API.
# Nothing about a device line forks the backend — the line exists so each
# client has its own origin, not its own service.
#
# These pointed at the DS stack for part of a day, while the native clients
# and the platform still lived in separate repositories and only the clients'
# tree carried the shell contract. A line served by a frontend built without
# it renders the web sign-in page inside the native frame, which is the one
# thing the contract exists to prevent. Once the trees were merged that reason
# went away, and with it the last thing DS was carrying.
#
# Serving /api/ under every line is the point of the design, not a convenience.
# It makes calls from inside a webview same-origin, which is what lets the
# session cookie stay SameSite=Strict and keeps CORS preflights from ever being
# issued. Drop the /api/ blocks and point a client at nexus.gerege.mn instead
# and every cookie-authenticated write becomes cross-site.
#
# server_name lists the lines explicitly rather than using a *.nexus.gerege.mn
# wildcard: a wildcard would also swallow any future subdomain that is meant to
# be a different product, exactly the trap the neighbouring vhost warns about.
#
# Install this file BEFORE running certbot (deploy/scripts/setup_ssl.sh) and
# request the certificate with every name above, e.g.
#   certbot --nginx -d desktop.nexus.gerege.mn -d mobile.nexus.gerege.mn \
#           -d kiosk.nexus.gerege.mn -d pos.nexus.gerege.mn
# Certbot rewrites this file in place — it adds the `listen 443 ssl` lines and
# the port-80 redirect block. Do not hand-write those.
#
# Zone names differ from the ones in nexus.gerege.mn.conf on purpose: two
# limit_req_zone directives with the same name is a config error, and sharing
# one budget between the browser line and the device lines would let traffic on
# one starve the other.
limit_req_zone $binary_remote_addr zone=device_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=device_oauth:10m rate=30r/m;

server {
    listen 80;
    # Хаяг нь form factor-ыг нэрлэнэ, платформыг биш: ширээн дээрх Mac ба
    # Windows хоёр `desktop`-ыг хуваалцана. `mac.` / `win.` / `ios.` /
    # `android.` нь 2026-09-02-нд энэ жагсаалтаас хасагдсан — тэднийг одоо
    # 000-catch-all.conf 404-өөр барина.
    server_name desktop.nexus.gerege.mn mobile.nexus.gerege.mn
                kiosk.nexus.gerege.mn pos.nexus.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Same reasoning as the browser line: the frontend upstream sets none
        # of these, and they are added here rather than at server level so the
        # API's own copies are not duplicated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        # Host is forwarded unchanged — the frontend reads it to decide which
        # device line it is serving (frontend/proxy.ts). Rewriting it to a
        # single canonical name would collapse all six lines into one.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll is a long poll the API holds open for 25s.
        proxy_read_timeout 90s;
    }

    # The OIDC endpoints. `location /` sends everything to the frontend, so
    # without these /oauth2/auth and the discovery document answer with the
    # Next.js shell instead and a sign-in started from a device line never
    # arrives.
    #
    # Written out rather than `include snippets/nexus-oauth.conf`: that snippet
    # belongs to the nexus stack and hard-codes its API port. Including it here
    # would send these lines' token exchange to a different deployment's issuer.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/appstore-keys.json {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=device_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/token {
        limit_req zone=device_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
