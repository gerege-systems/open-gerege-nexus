# nexus.gerege.mn — this repository's stack.
#
# Upstream ports come from docker-compose.prod.yml and are published on
# loopback only: 3000 frontend, 8080 API — the defaults, because this stack
# has the host to itself. It did not always: sso, client and tsm used to live
# here too, which is why every port is still an override. This block stays
# scoped to one server_name — never `default_server` or a `*.gerege.mn`
# wildcard — so that a neighbour moving back in swallows nothing.
#
# Install this file BEFORE running certbot (deploy/scripts/setup_ssl.sh).
# Certbot rewrites it in place: it adds the `listen 443 ssl` lines plus a
# second server block that redirects port 80 to https. Do not hand-write
# those — let certbot own them, otherwise renewal stops being able to find
# its anchors.
limit_req_zone $binary_remote_addr zone=nexus_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=nexus_oauth:10m rate=30r/m;

server {
    listen 80;
    server_name nexus.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # The API sets these on its own responses; the frontend upstream sets
        # none of them, so every screen a person actually looks at was served
        # with no clickjacking defence, no MIME-sniffing defence and no
        # referrer policy. They are set here rather than at server level
        # because nginx would then add a second copy to the API's own — and a
        # duplicated X-Frame-Options is one some browsers discard entirely,
        # which would weaken the header it was meant to add.
        #
        # `always` matters: without it nginx omits them on its own error
        # responses, which are the easiest ones to provoke.
        #
        # Content-Security-Policy is deliberately absent. A policy worth having
        # has to be written against what the Next.js build actually emits;
        # guessing one at the proxy is how a platform ends up with a blank
        # screen nobody can explain.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll is a long poll the API holds open for 25s. The default
        # 60s read timeout covers it, but state it so nobody tightens it blind.
        proxy_read_timeout 90s;
    }

    # These limits live at the shared ingress, so adding API replicas cannot
    # multiply an attacker's password/token budget. The application limiter is
    # retained as a second layer for deployments that bypass this nginx file.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=nexus_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else the OIDC provider serves at the root. Kept in a snippet
    # so an existing server — whose TLS block certbot owns — can be given them
    # by adding one line rather than by being rewritten.
    #
    # The path is nginx's own: this resolves to /etc/nginx/snippets/. Install
    # it alongside this file, from deploy/nginx/snippets/ in this repository:
    #
    #   cp deploy/nginx/snippets/nexus-oauth.conf /etc/nginx/snippets/
    #
    # Copying only the vhost leaves nginx -t failing on a missing include, and
    # a server that does start without these routed answers every OIDC
    # discovery request with the frontend's 404 — which is what issue #66 was.
    include snippets/nexus-oauth.conf;

    location = /oauth2/token {
        limit_req zone=nexus_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
