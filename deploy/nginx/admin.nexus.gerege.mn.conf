# admin.nexus.gerege.mn — the operator console.
#
# A separate virtual host for the same two upstreams the platform uses. Nothing
# new is published: the console is /api/platform/v1 on the API (8082) and /cp on the
# frontend (3008), and what makes it a separate thing is this file.
#
# Read docs/CONTROL_PLANE.md before installing it. In short:
#
#   1. Install this file and snippets/cp-allowlist.conf.
#   2. Put the addresses your operators actually come from in the snippet.
#      Until you do, it denies everything and the console is unreachable —
#      which is the correct state for a file nobody has configured.
#   3. Set CONTROL_PLANE_HOST=admin.nexus.gerege.mn in the API's environment.
#      Without it the API answers 404 on every /api/platform/v1 route in production.
#   4. Run certbot for this hostname, as for the others.
#
# The NCSC's guidance on administration interfaces is the reason for the shape
# of this: an admin interface should not be reachable from the internet at
# large, and the control that keeps it that way should not be the application's
# own login screen. Two things enforce that here — an address allowlist at the
# proxy, and CONTROL_PLANE_HOST in the API, which answers 404 to a request that
# arrived on any other hostname. Neither trusts the other.

# The console's own sign-in budget, separate from the platform's `nexus_auth`
# zone. Sharing one would let an attack on the public login screen consume the
# budget an operator needs to sign in and stop it.
limit_req_zone $binary_remote_addr zone=cp_auth:10m rate=5r/m;

server {
    listen 80;
    server_name admin.nexus.gerege.mn;

    # The ACME challenge is the one thing that must answer to everybody.
    #
    # nginx's access rules are inherited from the server block into every
    # location, so the allowlist below would refuse Let's Encrypt as readily as
    # it refuses anybody else — and the certificate would fail to issue and,
    # ninety days later, to renew. `allow all` here overrides the inherited
    # rule for this path only, which contains nothing but a challenge token.
    location /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    # Everything below this line is refused unless the caller's address is in
    # the allowlist. Placed at server level so it covers the frontend, the API
    # and anything either of them grows later — a per-location copy is one
    # location away from a hole.
    include snippets/cp-allowlist.conf;

    # The console is not for search engines, previews, or anything else that
    # follows a link it found. It is also not for framing.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Signing in and confirming a second factor, rate limited as a pair: they
    # are the two places where guessing pays.
    location ~ ^/api/platform/v1/(session|step-up)$ {
        limit_req zone=cp_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/platform/v1/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # Host is what the API's own gate compares against CONTROL_PLANE_HOST.
        # Passing $host rather than a literal keeps the two ends agreeing
        # without this file needing to know the value.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # One-release compatibility endpoint. The API returns a 308 to the
    # versioned path while preserving method, body, suffix, and query string.
    # It is proxied rather than redirected here so the API's HostGate remains
    # part of the old address's security boundary too.
    location /cp/api {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # On this hostname, the root *is* the console.
    #
    # The frontend serves the whole product from one build, so proxying "/"
    # straight through hands an operator the platform's marketing page at
    # admin.nexus.gerege.mn — which is what happened the first time this was
    # opened in a browser. The redirect is one line and the alternative is a
    # second frontend deployment.
    location = / {
        return 308 /cp;
    }

    # Everything else the build serves: the console's own pages and the assets
    # they need. Its layout answers 404 for /cp on any other hostname, and this
    # host is behind the allowlist above in any case.
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
