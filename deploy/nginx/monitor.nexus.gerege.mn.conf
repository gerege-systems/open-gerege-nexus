# monitor.nexus.gerege.mn — the observability stack's own domain.
#
# Grafana and Alertmanager used to be reachable only through an SSH tunnel to
# loopback, which is a fine answer for one person and a bad one for a team: the
# alert that fires at 03:00 names a dashboard nobody on call can open from a
# phone. This vhost is the other half of that trade — one more login surface on
# the public internet, in exchange for the dashboards being usable at the moment
# they are needed.
#
# What it does NOT expose, deliberately: Prometheus (9091), Loki (3100),
# cAdvisor (8085), Tempo (3200) and every exporter. Prometheus has no
# authentication at all and its query API will describe the whole deployment to
# anyone who asks; Grafana is the only piece of this stack designed to face a
# person, and it is also the one that can already query all of them.
#
# Grafana is served at /grafana rather than at the root, and that is not an
# oversight. It is where GF_SERVER_ROOT_URL and GF_SERVER_SERVE_FROM_SUB_PATH in
# deploy/docker-compose.monitoring.yml already put it — the same defaults every
# other Nexus deployment runs — and it leaves the root free for the neighbours
# below. The redirect at the bottom means nobody has to know that: typing the
# bare domain lands in Grafana.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.nexus.gerege.mn DNS wildcard is not a certificate
# wildcard:
#
#   cp deploy/nginx/monitor.nexus.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.nexus.gerege.mn \
#         /etc/nginx/sites-enabled/monitor.nexus.gerege.mn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d monitor.nexus.gerege.mn
#
# Certbot rewrites this file in place — it adds the `listen 443 ssl` lines and a
# second server block redirecting port 80. Do not hand-write those.

server {
    listen 80;
    server_name monitor.nexus.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # A monitoring console is not a page anybody should be framing, and it is
    # not a page a search engine should be indexing. `always` matters: without
    # it nginx omits these on its own error responses, which are the easiest
    # ones for a stranger to provoke.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Grafana. The port is GRAFANA_PORT from .env.monitoring, which is 3030 on
    # this host rather than the 3009 default — gerege_salus_frontend holds 3009,
    # and the first rollout failed on "port is already allocated" after every
    # other container had started.
    location /grafana/ {
        proxy_pass http://127.0.0.1:3030/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana's live tail and its dashboard refresh use websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A dashboard query over a wide range can take a while, and the default
        # 60s read timeout turns that into a 504 the user reads as "Grafana is
        # broken".
        proxy_read_timeout 300s;
    }

    # Alertmanager — silences, and what is firing right now.
    #
    # It has no authentication of its own and it never will: silencing an alert
    # is a write, and an open /alertmanager is a way for a stranger to make this
    # deployment stop telling anybody that it is broken. The basic-auth file is
    # NOT created by this repository; create it once on the host and this
    # location is the only thing behind it:
    #
    #   htpasswd -c /etc/nginx/.htpasswd-nexus-monitoring <user>
    #
    # If the file is missing, nginx -t fails rather than serving it open, which
    # is the failure mode to want.
    location /alertmanager/ {
        auth_basic "Nexus alerting";
        auth_basic_user_file /etc/nginx/.htpasswd-nexus-monitoring;

        proxy_pass http://127.0.0.1:9093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bare domain is what a person types and what an alert's link should be
    # able to use. Nothing is served here itself.
    location = / {
        return 301 https://$host/grafana/;
    }

    # Anything else on this domain is a probe, not a mistake anybody made.
    # Answering 404 from nginx rather than proxying it keeps the two upstreams
    # from seeing traffic that was never meant for them.
    location / {
        return 404;
    }
}
