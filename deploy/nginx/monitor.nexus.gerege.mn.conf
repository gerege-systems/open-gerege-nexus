# monitor.nexus.gerege.mn — the observability stack's own domain.
#
# Grafana and Alertmanager used to be reachable only through an SSH tunnel to
# loopback, which is a fine answer for one person and a bad one for a team: the
# alert that fires at 03:00 names a dashboard nobody on call can open from a
# phone. This vhost is the other half of that trade — one more login surface on
# the public internet, in exchange for the dashboards being usable at the moment
# they are needed.
#
# What it does NOT expose, deliberately: Prometheus (9091), Loki (3100),
# cAdvisor (8085), Tempo (3200) and every exporter. Prometheus has no
# authentication at all and its query API will describe the whole deployment to
# anyone who asks; Grafana is the only piece of this stack designed to face a
# person, and it is also the one that can already query all of them.
#
# Grafana is served at /grafana rather than at the root, and that is not an
# oversight. It is where GF_SERVER_ROOT_URL and GF_SERVER_SERVE_FROM_SUB_PATH in
# deploy/docker-compose.monitoring.yml already put it — the same defaults every
# other Nexus deployment runs — and it leaves the root free for the neighbours
# below. The bare domain serves the landing page at the bottom, which explains
# what this domain is and links into both of them.
#
# The Gerege branding (the login card, the logo, the tab icon, the Mongolian
# translation) is NOT in this file: `deploy/scripts/setup_monitor_branding.sh`
# installs it into /var/www/monitor and generates the snippet included below.
# Run it once per host, and again after every Grafana upgrade.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.nexus.gerege.mn DNS wildcard is not a certificate
# wildcard:
#
#   cp deploy/nginx/monitor.nexus.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.nexus.gerege.mn \
#         /etc/nginx/sites-enabled/monitor.nexus.gerege.mn
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d monitor.nexus.gerege.mn
#
# Certbot rewrites this file in place — it adds the `listen 443 ssl` lines and a
# second server block redirecting port 80. Do not hand-write those.

server {
    listen 80;
    server_name monitor.nexus.gerege.mn;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. nginx 1.25.1-ээс хойш ийм
    # хэлбэрийг дэмждэг.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # nginx's own defaults are gzip_proxied off / gzip_types text/html, i.e. it
    # re-compresses nothing that came from a proxy. The Grafana location below
    # clears Accept-Encoding upstream so sub_filter can see the HTML — without
    # this pair, every JS bundle behind it would then go out uncompressed.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # A monitoring console is not a page anybody should be framing, and it is
    # not a page a search engine should be indexing. `always` matters: without
    # it nginx omits these on its own error responses, which are the easiest
    # ones for a stranger to provoke.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Grafana. The port is GRAFANA_PORT from .env.monitoring, which is 3030 on
    # this host rather than the 3009 default — gerege_salus_frontend holds 3009,
    # and the first rollout failed on "port is already allocated" after every
    # other container had started.
    location /grafana/ {
        # No trailing slash on proxy_pass, deliberately. With one, nginx strips
        # the /grafana prefix before forwarding — and Grafana is started with
        # GF_SERVER_SERVE_FROM_SUB_PATH=true, so it expects to receive that
        # prefix and redirects anything else to its root URL. The two together
        # are an infinite redirect: /grafana/ → /grafana/ → /grafana/.
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana's live tail and its dashboard refresh use websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A dashboard query over a wide range can take a while, and the default
        # 60s read timeout turns that into a 504 the user reads as "Grafana is
        # broken".
        proxy_read_timeout 300s;

        # Grafana OSS has no branding hook — white labeling is Enterprise — so
        # the Gerege stylesheet and the avatar script are injected into every
        # HTML response here. sub_filter cannot touch a compressed body, hence
        # the empty Accept-Encoding (and the gzip pair above).
        #
        # Both files must ride in ONE directive: nginx offers each sub_filter
        # the original bytes, so a second filter on '</head>' would never match
        # what the first one already replaced.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/grafana-gerege.css"><script src="/grafana-gerege.js" defer></script></head>';
        sub_filter '<title>Grafana</title>' '<title>Ажиглалт — Gerege Nexus</title>';
        sub_filter_once on;
    }

    # Alertmanager — silences, and what is firing right now.
    #
    # It has no authentication of its own and it never will: silencing an alert
    # is a write, and an open /alertmanager is a way for a stranger to make this
    # deployment stop telling anybody that it is broken. The basic-auth file is
    # NOT created by this repository; create it once on the host and this
    # location is the only thing behind it:
    #
    #   htpasswd -c /etc/nginx/.htpasswd-nexus-monitoring <user>
    #
    # If the file is missing, nginx -t fails rather than serving it open, which
    # is the failure mode to want.
    location /alertmanager/ {
        auth_basic "Nexus alerting";
        auth_basic_user_file /etc/nginx/.htpasswd-nexus-monitoring;

        proxy_pass http://127.0.0.1:9093/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bare domain is what a person types and what an alert's link should be
    # able to use. It used to 301 straight into Grafana, which served the second
    # case and abandoned the first: whoever typed the domain landed on a login
    # form with no word about what they had reached. The landing page is that
    # word, and every route into the stack is one click from it. Installed from
    # deploy/nginx/monitor-landing/index.html.
    location = / {
        root /var/www/monitor;
        try_files /index.html =404;
    }

    location = /grafana-gerege.css { root /var/www/monitor; }
    location = /grafana-gerege.js  { root /var/www/monitor; }

    # Grafana's own mark, in the browser tab and on the phone home screen.
    # nginx types a response from the extension in the URI, not from the alias
    # target, so the empty types block is what stops a .webp going out labelled
    # image/png.
    location = /grafana/public/build/img/fav32.png {
        alias /var/www/monitor/grafana-favicon.webp;
        types { } default_type image/webp;
    }
    location = /grafana/public/build/img/apple-touch-icon.png {
        alias /var/www/monitor/grafana-favicon.webp;
        types { } default_type image/webp;
    }

    # Generated by deploy/scripts/setup_monitor_branding.sh: the two Grafana
    # chunks that carry the language list and the Mongolian translation. Their
    # names contain content hashes, so they change with every Grafana version —
    # which is why they are not written by hand here.
    #
    # The wildcard is deliberate: a plain include of a missing file makes
    # `nginx -t` fail, and on a fresh host this vhost has to pass that test
    # BEFORE the script has ever run (certbot needs a working vhost first). A
    # wildcard that matches nothing is not an error, so the domain comes up
    # unbranded and the script fills it in afterwards.
    include snippets/monitor-grafana-overrides*.conf;

    # Anything else on this domain is a probe, not a mistake anybody made.
    # Answering 404 from nginx rather than proxying it keeps the two upstreams
    # from seeing traffic that was never meant for them.
    location / {
        return 404;
    }
}
