# Catch-all: нэрээ нэрлээгүй бүх хүсэлт эндээс цааш явахгүй.
#
# Яагаад хэрэгтэй болсон бэ: `*.open.gerege.mn` wildcard DNS бичлэг нэмэгдсэн.
# Түүнээс хойш ДУРЫН дэд домэйн энэ сервер рүү resolve болно — үсгийн алдаа,
# хуучирсан нэр, санамсаргүй хайлт бүр орно. nginx-д тохирох `server_name`
# байхгүй үед хүсэлт нь тохиргоонд хамгийн түрүүнд тааралдсан server блок руу
# унадаг. Энэ хостод тэр нь `ds.open.gerege.mn` байсан:
#
#   $ curl -v https://nothing-here.open.gerege.mn/
#   *  subject: CN=ds.open.gerege.mn
#
# Өөрөөр хэлбэл нэг бүтээгдэхүүн нөгөөгийнхөө нэрээр үйлчилж, буруу тохиргоо
# чимээгүй нуугдаж байсан. `default_server`-ыг ТОДОРХОЙ зарлаж, түүнийг юу ч
# үйлчилдэггүй блок болгосноор энэ хоёр асуудал хоёулаа арилна.
#
# Нэрээ нэрлэсэн vhost-ууд огт хөндөгдөхгүй: nginx яг тохирох `server_name`-ыг
# үргэлж эхэлж сонгодог тул nexus, ds, js, sso, salus, device-lines бүгд
# урьдын адил ажиллана.

server {
    listen 80 default_server;
    server_name _;

    # ACME HTTP-01 нь энд ирэхгүй — гэрчилгээтэй нэр бүр өөрийн vhost-той.
    # Гэхдээ шинэ нэрэнд гэрчилгээ авахаас өмнө түүний vhost суудаг тул энэ
    # блок тэр урсгалыг хэзээ ч таслахгүй.
    #
    # 404 нь санаатай: wildcard-аас өмнө танихгүй нэр яг үүнийг авдаг байсан
    # (ds-ийн certbot блокоос). Ижил хариу үлдээснээр гаднаас харагдах зан
    # төлөв өөрчлөгдөхгүй — зөвхөн хэн хариулж байгаа нь санамсаргүй биш болно.
    return 404;
}

server {
    listen 443 ssl default_server;
    server_name _;

    # Танихгүй SNI-д гэрчилгээ ОГТ үзүүлэхгүй, handshake-ийг таслана. Ингэснээр
    # `nothing-here.open.gerege.mn` рүү орсон хүн `ds`-ийн гэрчилгээг харахаа
    # больж, ямар нэг агуулга ч хүлээж авахгүй. nginx 1.19.4-өөс дээш.
    ssl_reject_handshake on;
}
