# dwh.nexus.gerege.mn — дата агуулах (data warehouse), BI ба AI давхарга.
#
# Ард нь deploy/docker-compose.dwh.yml-ийн контейнер, зөвхөн loopback дээр.
#
# Install this file BEFORE running certbot. Every subdomain on this host has its
# own certificate; the *.nexus.gerege.mn DNS wildcard is not a certificate one:
#
#   cp deploy/nginx/dwh.nexus.gerege.mn.conf /etc/nginx/sites-available/dwh.nexus.gerege.mn
#   ln -s /etc/nginx/sites-available/dwh.nexus.gerege.mn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dwh.nexus.gerege.mn
#
# Certbot rewrites this file in place. Do not hand-write the TLS block.

server {
    listen 80;
    server_name dwh.nexus.gerege.mn;

    # HTTP/2. Certbot нь `listen 443 ssl` мөрийг өөрөө бичдэг ба тэр мөрөнд
    # протоколыг нэмдэггүй, тиймээс энэ нь тусдаа заавар байх ёстой — тэгвэл
    # гэрчилгээ шинэчлэх бүрд алга болохгүй. nginx 1.25.1-ээс хойш ийм
    # хэлбэрийг дэмждэг.
    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Хуудас нь гадагшаа юу ч татдаггүй: CSS, script нь дотор нь, фонт нь
    # системийнх, зураг байхгүй, аналитик байхгүй. Бодлого нь тэрийг үг үгээр
    # нь хэлнэ — ирээдүйд хэн нэгэн мөрдөх код эсвэл гадны фонт нэмвэл
    # чимээгүй ажиллахгүй, эндээс л зогсоно.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # text/html-ийг жагсаалтад бичихгүй: nginx түүнийг үргэлж шахдаг тул
    # давхардсан төрөл гэж анхааруулга өгнө. Хуудас нь ганц HTML файл учраас
    # энэ мөр л ажиллана.
    gzip on;
    gzip_min_length 1024;

    # Хуудас нэг файл бөгөөд агуулгын hash-гүй. Урт кэш өгвөл засвар хийсний
    # дараа хуучин хувилбар хүмүүсийн браузерт үлдэнэ; богино кэш нь ачааллыг
    # барьж, шинэчлэлтийг хэдэн минутын дотор хүргэнэ.
    #
    # Энэ хоёр мөр location дотор байсан бөгөөд тэр нь бүх аюулгүй байдлын
    # толгойг чимээгүй унтраасан: nginx-ийн add_header өв залгамжлахгүй —
    # хүү блок дотор НЭГ ч add_header байвал дээрхийг нь бүгдийг нь хаяна.
    # Хариу 200 өгсөөр, CSP ба HSTS алга болсон нь зөвхөн толгойг нь уншиж
    # байж мэдэгдэнэ.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=300" always;

    location / {
        proxy_pass http://127.0.0.1:3018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
