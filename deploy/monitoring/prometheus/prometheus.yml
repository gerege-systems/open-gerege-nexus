# Gerege Nexus — Prometheus.
#
# Static targets, not service discovery. This is one server running Docker
# Compose: the set of things to scrape is the set of services in two compose
# files, it changes when a release changes it, and a discovery mechanism would
# add a moving part to answer a question that has a fixed answer.
#
# Every target is reached by container name over the shared Docker network —
# see the `networks` block in deploy/docker-compose.monitoring.yml. Nothing here
# goes through the host's published ports, which are bound to loopback and are
# for an operator with an SSH tunnel.

global:
  # 15s is the resolution every dashboard and every burn-rate rule in
  # rules/ assumes. Raising it silently widens the shortest alert window.
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    # Named on every alert Alertmanager sends, so a person woken at 03:00 knows
    # which deployment before opening anything.
    deployment: "${DEPLOYMENT_NAME}"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["gerege_nexus_alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The platform itself. This is the only target whose absence is an outage:
  # everything else here describes the deployment, this one *is* it.
  - job_name: nexus_api
    metrics_path: /metrics
    static_configs:
      - targets: ["gerege_nexus_backend:8080"]
        labels:
          service: api

  # There is deliberately no separate job scraping /health. It answers JSON
  # rather than the exposition format, so every scrape would log a parse error
  # to say the endpoint is fine — and `up{job="nexus_api"}` already carries the
  # same fact, from an endpoint served by the same process and the same
  # listener. Checking /health from *outside* this server is a real gap and it
  # is answered by Uptime Kuma on another host (docs/OPERATIONS.md).

  - job_name: node
    static_configs:
      - targets: ["gerege_nexus_node_exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["gerege_nexus_cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["gerege_nexus_postgres_exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["gerege_nexus_redis_exporter:9121"]

  # The stack watching the stack. A Prometheus that has stopped ingesting, a
  # Loki that is rejecting writes and an Alertmanager that cannot deliver are
  # all invisible from anywhere else — and all three make every other alert
  # here worthless while they last.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["gerege_nexus_alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["gerege_nexus_loki:3100"]

  # Grafana is told to serve from /grafana (GF_SERVER_SERVE_FROM_SUB_PATH), so
  # its own metrics move with everything else. Scraping /metrics gets a 302 to
  # the public root URL, which Prometheus then cannot reach from inside the
  # network — it looked like Grafana was down while it was serving fine.
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["gerege_nexus_grafana:3000"]
