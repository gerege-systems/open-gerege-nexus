# The off-site backup store.
#
# deploy/scripts/backup.sh writes a dump to the disk of the machine it is
# protecting, which is most of a backup and not all of one: the copy dies with
# the host it was taken from. This is the other half — an S3-compatible store on
# a *different* machine that every deployment pushes its encrypted dump to.
#
# It runs on nexus.gerege.mn, and that has one honest limitation worth writing
# down rather than discovering: for nexus's *own* dump this is a second copy on
# the same machine. It defends against somebody dropping a table, a bad
# migration, or a volume being recreated — not against losing the host. For
# every other deployment (fuelnet, dgov, appstore, pos, eduge, and the products
# that live on their own machines) it is a genuine off-site copy, which is the
# case that was completely unprotected before.
#
# Replicating this store outward is the step that closes the last gap; MinIO
# does it with `mc mirror` on a timer, and it needs somewhere to mirror to.
#
# Three properties, in the order they matter:
#
#   * The dumps arrive already encrypted. The source host holds only an age
#     *public* key, so a compromised platform cannot read what it has already
#     sent, and whoever holds this store cannot read any of it. The private key
#     lives with the operator and nowhere else — see docs/OPERATIONS.md.
#   * Versioning is on and the per-deployment key may not delete. A source host
#     that is taken over can add objects and cannot remove the history, which is
#     the property that survives ransomware.
#   * Only the S3 API faces the internet, behind nginx and TLS. MinIO's console
#     stays on loopback for somebody with an SSH tunnel: it is a second login
#     surface and nothing routine needs it.
#
# Bring it up:
#   cd /opt/open-gerege-nexus
#   docker compose -f deploy/docker-compose.backups.yml --env-file .env.backups up -d

name: nexus-backups

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nexus_backups_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # What a client is told to talk to. Wrong here and every presigned URL and
      # every redirect points somewhere that does not exist.
      MINIO_SERVER_URL: ${BACKUPS_PUBLIC_URL:?BACKUPS_PUBLIC_URL is required}
      MINIO_BROWSER_REDIRECT_URL: ${BACKUPS_PUBLIC_URL}/console
      # Nothing here is a public bucket and nothing here is a website.
      MINIO_BROWSER: "on"
    volumes:
      - nexus_backups_data:/data
    ports:
      # The S3 API on loopback, published to the internet by nginx and by
      # nothing else. The console is loopback-only and stays that way.
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  # Named explicitly for the same reason the monitoring stack names its volumes:
  # compose otherwise derives the name from the directory, so moving the stack
  # silently brings it up on an empty disk — a healthy container holding no
  # backups, which is the worst state this particular service can be in.
  nexus_backups_data:
    name: nexus_backups_data
