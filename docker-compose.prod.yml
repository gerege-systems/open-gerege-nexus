# Production stack for Gerege Nexus.
#
# The default origin is nexus.gerege.mn. It drives CORS, the OIDC issuer and the
# eID callback in one place, so moving it is a coordinated change: DNS, the TLS
# certificate and any client pinning the issuer all follow. It replaced
# openerp.gerege.mn in the Gerege Nexus rebrand. Set PUBLIC_ORIGIN to move it.
#
# This file pulls pre-built images from GHCR — it never builds on the server.
# CI builds and pushes both images, copies this file over and runs it, so the
# server needs neither the source tree nor a Go/Node toolchain.
#
# Required environment (see deploy/.env.prod.example):
#   IMAGE_BACKEND, IMAGE_FRONTEND, IMAGE_TAG, POSTGRES_PASSWORD,
#   SSO_DEFAULT_CLIENT_SECRET, PUBLIC_ORIGIN
#
# ── A second stack on the same host ─────────────────────────────────────────
#
# Everything a deployment must not share with a neighbour is a variable now:
# STACK prefixes the container names, POSTGRES_VOLUME and CATALOG_CACHE_VOLUME
# name the data, and the four *_HOST_PORT variables place the published ports.
# Every default is what nexus.gerege.mn already runs, so this file unchanged is
# still that deployment, byte for byte.
#
# It is written down because the alternative was found the hard way. Gerege
# Salus stood up beside Gerege Nexus on this host with a forked copy of this
# file, and the fork's first two fixes were "stop the Salus rollout from
# tearing down the Gerege Nexus stack" and "shift Salus Postgres to 5436" —
# both of them collisions between two stacks that had no way to say they were
# different. A deployment differing by a name and a port should not need a
# repository of its own to say so.
#
# POSTGRES_VOLUME is the dangerous one and is deliberately not derived from
# STACK: a name is a pointer to a disk somewhere, and a stack that renamed
# itself would otherwise come up healthy on an empty database. Set it once,
# then treat it the way the note at the bottom of this file describes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK:-gerege_nexus}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Invalidation fan-out and the deployment-wide rate-limit counters. It holds
  # no cached values and no session: everything in it can be lost on a restart
  # without a user noticing, so it needs no volume and no backup. What is lost
  # is the fan-out, and the caches it feeds all expire on their own.
  redis:
    image: redis:7-alpine
    container_name: ${STACK:-gerege_nexus}_redis
    restart: unless-stopped
    # No persistence: this is a coordination point, not a store.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot migration runner. `up -d` waits for it to exit successfully before
  # starting the API, so the schema is never behind the binary.
  migrate:
    image: ${IMAGE_BACKEND}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-gerege_nexus}_migrate
    pull_policy: always
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${IMAGE_BACKEND}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-gerege_nexus}_backend
    restart: unless-stopped
    # So the operator console can read the monitoring stack, which publishes on
    # the host's loopback rather than on this compose network. Harmless when
    # PROMETHEUS_URL is unset — it is a name that resolves and nothing asks for
    # it — and it is the smallest arrangement that does not put the API on the
    # monitoring network or the monitoring stack on this one.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    pull_policy: always
    environment:
      # The API switches into the unprivileged gerege_nexus_app role for the
      # duration of every tenant-scoped query (see internal/kernel/dbguard),
      # so the row-level policies from migration 00029 apply even though this
      # connects as the owner. That protects against a handler that forgets its
      # WHERE tenant_id, which is what the policies are for.
      #
      # It does not protect against the process itself: whoever can run code
      # here can also RESET ROLE. To close that too, create a login role that
      # owns nothing, GRANT gerege_nexus_app TO it, and point this at it —
      # nothing in the application changes.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      # Leave REDIS_URL empty and the platform runs exactly as it did before it
      # existed: invalidation stays inside the process and rate limits are
      # counted per replica. That is only correct while there is one replica.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PORT: 8080
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://nexus.gerege.mn}
      # The browser line plus one origin per device line. Every device line is
      # a separate host that nginx points at this same API container — the
      # backend stays single, the origins do not, and both CORS and the CSRF
      # origin check read this one list.
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://nexus.gerege.mn},${DEVICE_LINE_ORIGINS:-https://mac.nexus.gerege.mn,https://win.nexus.gerege.mn,https://ios.nexus.gerege.mn,https://android.nexus.gerege.mn,https://kiosk.nexus.gerege.mn,https://pos.nexus.gerege.mn}
      # Nginx terminates TLS in front of the API, so the forwarded client
      # address can be trusted here.
      TRUST_PROXY_HEADERS: "true"
      # What this deployment calls itself. The frontend service below is given
      # the same value and four more: they are halves of one setting, and a
      # stack that renames only one of them has an eID prompt and a sign-in
      # screen disagreeing about which product this is. Unset is Gerege Nexus.
      BRAND_NAME: ${BRAND_NAME:-}
      SSO_ISSUER: ${PUBLIC_ORIGIN:-https://nexus.gerege.mn}
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET:?SSO_DEFAULT_CLIENT_SECRET is required in production}
      # The Google button on this platform's own sign-in screen. Off unless a
      # client id is set, and separate from the connector credentials below on
      # purpose — see .env.example.
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID:-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET:-}
      GOOGLE_LOGIN_TENANT: ${GOOGLE_LOGIN_TENANT:-}
      GOOGLE_LOGIN_ALLOWED_DOMAINS: ${GOOGLE_LOGIN_ALLOWED_DOMAINS:-}

      # Signing this deployment's own people in at another provider. Empty is
      # the normal case — this instance issues its own identities. Setting the
      # issuer closes the local sign-in paths and hands the login screen over;
      # see docs/SSO_FEDERATION.md.
      SSO_CLIENT_ISSUER: ${SSO_CLIENT_ISSUER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_CLIENT_PROVIDER_NAME: ${SSO_CLIENT_PROVIDER_NAME:-}
      SSO_CLIENT_SCOPES: ${SSO_CLIENT_SCOPES:-}
      SSO_CLIENT_TENANT: ${SSO_CLIENT_TENANT:-}
      SSO_CLIENT_LOCAL_LOGIN: ${SSO_CLIENT_LOCAL_LOGIN:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TTS_MODEL: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
      GEMINI_VOICE: ${GEMINI_VOICE:-Kore}
      # DEMO_MODE turns this deployment into a public showcase: it seeds the
      # published demo account and lets the E-ID / DAN / XYP connectors answer
      # with canned identities. Anyone can then sign in, so leave it false for
      # any instance holding real data.
      SEED_DEMO_DATA: ${DEMO_MODE:-false}
      # eID can use real RP credentials while the rest of the public showcase
      # keeps demo data and mock DAN/XYP connectors enabled.
      EID_MOCK_MODE: ${EID_MOCK_MODE:-false}
      EID_BASE_URL: ${EID_BASE_URL:-https://eidmongolia.mn/v3}
      EID_RP_UUID: ${EID_RP_UUID:-}
      EID_RP_SECRET: ${EID_RP_SECRET:-}
      EID_RP_NAME: ${EID_RP_NAME:-Gerege Nexus}
      EID_CERT_LEVEL: ${EID_CERT_LEVEL:-ADVANCED}
      EID_DISPLAY_TEXT: ${EID_DISPLAY_TEXT:-Gerege Nexus-д нэвтрэх}
      EID_JIT_TENANT_SLUG: ${EID_JIT_TENANT_SLUG:-}
      # eID Mongolia qualified PDF signing. It reuses the RP credentials above —
      # one registration carries both the authentication and the SIGNATURE
      # permission — so only the signing-specific overrides appear here.
      # EID_SIGN_CERT_LEVEL is deliberately QUALIFIED rather than the ADVANCED
      # used for sign-in: an advanced signature is not what тоон гарын үсэг means
      # in law, and accepting one would downgrade every document produced.
      EID_SIGN_MOCK_MODE: ${EID_SIGN_MOCK_MODE:-false}
      EID_SIGN_BASE_URL: ${EID_SIGN_BASE_URL:-}
      EID_SIGN_CERT_LEVEL: ${EID_SIGN_CERT_LEVEL:-QUALIFIED}
      EID_SIGN_DISPLAY_TEXT: ${EID_SIGN_DISPLAY_TEXT:-}
      # Server Document-Signer, used only when eID's own stamp endpoint is
      # unavailable — it is what turns a stamp outage into a self-embedded
      # PAdES rather than no signed PDF at all. Signing works without it; the
      # fallback does not. The certificate must be the SAME across restarts and
      # replicas, so it is supplied rather than generated.
      EID_SIGN_SIGNER_CERT_PEM: ${EID_SIGN_SIGNER_CERT_PEM:-}
      EID_SIGN_SIGNER_KEY_PEM: ${EID_SIGN_SIGNER_KEY_PEM:-}
      # Gerege eSign HSM, the older signing rail. These were absent entirely,
      # which left the service in mock mode on a production instance: mock
      # SignPDF returns the submitted PDF unchanged, so documents were marked
      # SIGNED while carrying no signature at all. Set ESIGN_TOKEN to use it, or
      # turn the rail off from the signing policy screen.
      ESIGN_MOCK_MODE: ${ESIGN_MOCK_MODE:-false}
      ESIGN_LOGIN_URL: ${ESIGN_LOGIN_URL:-https://hsm.gerege.mn/esign/login}
      ESIGN_SIGN_URL: ${ESIGN_SIGN_URL:-https://hsm.gerege.mn/signer/signpdf}
      ESIGN_TOKEN: ${ESIGN_TOKEN:-}
      DAN_MOCK_MODE: ${DEMO_MODE:-false}
      XYP_MOCK_MODE: ${DEMO_MODE:-false}
      # Email verification runs through a hosted service, so this deployment
      # holds no mailbox credential for it — only the key that identifies this
      # platform to that service. Left empty, no verification mail can be
      # requested and the settings screen says exactly that.
      EMAIL_VERIFY_API_KEY: ${EMAIL_VERIFY_API_KEY:-}
      # Extra hostnames a verification link may return somebody to.
      # PUBLIC_ORIGIN is always allowed without being listed here.
      EMAIL_VERIFY_REDIRECT_HOSTS: ${EMAIL_VERIFY_REDIRECT_HOSTS:-}
      # How long a session may go unused, on top of its absolute lifetime.
      # 0 turns it off.
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-90m}
      EMAIL_VERIFY_BASE_URL: ${EMAIL_VERIFY_BASE_URL:-}
      # The hostname the operator console answers on. Empty means this
      # deployment has no console at all — see docs/CONTROL_PLANE.md.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}
      # The addresses the console answers to *while the platform is private*.
      # Empty, or the word "open", means no address restriction — which is what
      # a public deployment wants. See internal/operator/operator/address.go.
      CONTROL_PLANE_ALLOWED_CIDRS: ${CONTROL_PLANE_ALLOWED_CIDRS:-}
      # What the console's front page reads. All optional: without them the
      # page shows the parts that come from this platform's own database and
      # says the rest is not configured.
      #
      # The monitoring stack publishes on the host's loopback, so from inside
      # this container the address is the host gateway — hence the extra_hosts
      # entry below. A deployment that puts this service on the monitoring
      # network instead can use the container names.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      # The deploy button. The token is a fine-grained one with permission for
      # the deploy workflow and nothing else; without it the button refuses and
      # says why.
      GITHUB_DEPLOY_TOKEN: ${GITHUB_DEPLOY_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      GITHUB_DEPLOY_WORKFLOW: ${GITHUB_DEPLOY_WORKFLOW:-deploy.yml}
      # Integration connectors. Without the key the server refuses to store a
      # credential rather than storing it in the clear, so Drive, Dropbox and
      # Meet simply cannot be saved — which is the visible failure, not a
      # silent one. Generate with: openssl rand -base64 32
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # A connector target is an address a tenant types in and this server
      # connects to, from inside the network. Addresses that belong to the
      # deployment — loopback, private, link-local, the cloud metadata service —
      # are refused unless a self-hosted operator deliberately allows them.
      INTEGRATION_ALLOW_PRIVATE_TARGETS: ${INTEGRATION_ALLOW_PRIVATE_TARGETS:-false}
      # OAuth clients belong to whoever operates this deployment, not to each
      # tenant: the consent screen is this platform's. Leave them empty and the
      # providers report themselves unavailable with the reason, instead of
      # offering a form that cannot work.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      DROPBOX_OAUTH_CLIENT_ID: ${DROPBOX_OAUTH_CLIENT_ID:-}
      DROPBOX_OAUTH_CLIENT_SECRET: ${DROPBOX_OAUTH_CLIENT_SECRET:-}
      # Where the app catalogue comes from. Empty is the file that ships in the
      # image, which is how this deployment has always run; setting both of
      # these puts the registry in front of it, with the disk cache and that
      # file behind. Boot never fails because of the registry — see
      # appcatalog.Provider — so turning this on is reversible by emptying it.
      APP_CATALOG_URL: ${APP_CATALOG_URL:-}
      APPSTORE_PUBLIC_KEY: ${APPSTORE_PUBLIC_KEY:-}
      # What this deployment is to the registry, when the App Store has issued
      # it a credential. It decides *which* catalogue comes back — the public
      # one, or the public one plus the apps published to this platform by
      # name. Empty asks anonymously and gets what everybody may see.
      APP_CATALOG_TOKEN: ${APP_CATALOG_TOKEN:-}
      CATALOG_SYNC_INTERVAL: ${CATALOG_SYNC_INTERVAL:-1h}
      CATALOG_CACHE_PATH: /var/lib/nexus/catalog.cache.json
      # «Өртөө» — платформ хоорондын даалгаврын суваг (docs/URTUU.md).
      #
      # Түлхүүргүй бол суваг УНТРААЛТТАЙ бөгөөд платформ хэвийн асна: холбоос
      # үүсгэх боломжгүй, /.well-known/urtuu.json нь "энэ суулгац Өртөө
      # ажиллуулдаггүй" гэж хариулна. Тавьсан цагаас эхлэн энэ суулгац
      # өөрийн мөртэй болно — түлхүүрээс гарах суулгацын ID нь даалгаврын
      # мөчлөгийн хамгаалалт, холбоос бүрийн token хоёрын үндэс.
      #
      # Үүсгэх: openssl rand -base64 32
      #
      # СОЛИХГҮЙ. Түлхүүр солигдвол суулгацын ID өөрчлөгдөж, одоо байгаа
      # холбоос бүрийн token хүчингүй болж, нөгөө талын хадгалсан нийтийн
      # түлхүүр буруу болно. Холбоосын мөр бүр installation_id-тай тул
      # тэдгээр нь чимээгүй унтрахгүй — аль нь хуучин түлхүүрээрх болохыг
      # нэрлэнэ — гэхдээ дахин байгуулах хэрэгтэй болно.
      URTUU_SIGNING_KEY: ${URTUU_SIGNING_KEY:-}
      # http:// хаягтай холбоос зөвшөөрөх эсэх. Анхдагчаар хаалттай: холбоосын
      # token нь Authorization толгойгоор явдаг тул http дээр байгуулсан
      # холбоос түүнийг замд байгаа бүх хүнд өгнө. Төрийн хаалттай сүлжээн
      # дэх суулгацууд л зориудаар асаана.
      URTUU_ALLOW_INSECURE_PEERS: ${URTUU_ALLOW_INSECURE_PEERS:-false}
      # Хүсэлтийн кодын эх сурвалж — ring.dgov.mn (docs/RING_STANDARD.md).
      # Гурвуулаа хоосон бол импорт унтраалттай, локал кодууд ажиллана.
      # RING_PUBLIC_KEY-гүй бол импорт БАЙХГҮЙ: шалгагдаагүй бүртгэл нь бүх
      # суулгац дээрх кодын утга, хугацааны нормыг өөрчлөх эрхтэй баримт.
      RING_BASE_URL: ${RING_BASE_URL:-}
      RING_API_KEY: ${RING_API_KEY:-}
      RING_PUBLIC_KEY: ${RING_PUBLIC_KEY:-}
      # Агшинг ӨДӨР болгож бууруулах цагийн бүс: хэрэглээний тоолуур, тайлангийн
      # огнооны муж, cron-ий цаг, бүртгэлийн дугаарын он. Хадгалалт хөндөгдөхгүй
      # — багана бүр timestamptz хэвээр. Өгөгдлийн сангийн session мөн үүгээр
      # тохируулагдана (dbguard), тиймээс Go болон SQL хоёр нэг календарь уншина.
      PLATFORM_TIMEZONE: ${PLATFORM_TIMEZONE:-Asia/Ulaanbaatar}
      # Observability. Both empty by default, and empty is genuinely off: no
      # exporter, no batch processor, no background goroutine. The monitoring
      # stack (deploy/docker-compose.monitoring.yml) runs the Tempo this points
      # at, on this stack's own network — see docs/MONITORING.md.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      # Panic reporting over the Sentry protocol, to GlitchTip or to a hosted
      # Sentry. Events carry the request id, the route and the tenant — never a
      # body, a cookie, a query string or a person's address.
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE_VERSION: ${IMAGE_TAG:-latest}
      # Scheduled reports. Empty means a due schedule is still produced and
      # still recorded, and nothing is sent — see docs/REPORTS.md.
      REPORT_SMTP_URL: ${REPORT_SMTP_URL:-}
      REPORT_MAIL_FROM: ${REPORT_MAIL_FROM:-}
      REPORT_SMTP_STARTTLS: ${REPORT_SMTP_STARTTLS:-true}
      # The publishing console's OAuth2 client is registered from this at
      # startup. Empty registers nothing.
      DEVELOPER_CONSOLE_ORIGIN: ${CONSOLE_ORIGIN:-}
      DEVELOPER_CONSOLE_CLIENT_ID: ${CONSOLE_CLIENT_ID:-gerege-developer-console}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8082}:8080"
    volumes:
      # The last catalogue accepted from the registry. It survives a restart so
      # an instance whose registry is down comes back on what it was serving
      # rather than on what the release shipped with.
      - catalog_cache:/var/lib/nexus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${IMAGE_FRONTEND}:${IMAGE_TAG:-latest}
    container_name: ${STACK:-gerege_nexus}_frontend
    restart: unless-stopped
    pull_policy: always
    environment:
      # The rendering server's own error reporting, read at runtime. The
      # browser half is NEXT_PUBLIC_SENTRY_DSN and is baked into the bundle at
      # image build time — see frontend/Dockerfile for why it cannot be set
      # here.
      # Where the shell asks, server-side, what this deployment carries.
      #
      # The browser never uses this — it asks its own origin (lib/apiBase.ts).
      # A server has no origin, which is the whole reason the value exists, and
      # until now this file never supplied it: every server-side question the
      # shell asks the API answered `null` on every deployment that uses this
      # compose file. The storefront was the visible one — an app-store
      # installation rendered the platform page instead of its catalogue,
      # which is precisely what lib/storefront.ts says it must not do.
      #
      # The default is the service beside it on this compose network, so a
      # deployment that has never heard of this variable is fixed by upgrading.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8080/api/v1}
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      RELEASE_VERSION: ${IMAGE_TAG:-latest}
      # Read at request time by app/cp/layout.tsx, which answers 404 for the
      # console's pages on any other hostname. The same value the backend gets;
      # they are two halves of one rule and a deployment that sets only one of
      # them has a console whose pages and whose API disagree about where it
      # lives.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}
      # The addresses the console answers to *while the platform is private*.
      # Empty, or the word "open", means no address restriction — which is what
      # a public deployment wants. See internal/operator/operator/address.go.
      CONTROL_PLANE_ALLOWED_CIDRS: ${CONTROL_PLANE_ALLOWED_CIDRS:-}
      # The brand, read per request rather than baked in — see
      # frontend/lib/brand.ts. This is why the shell's HTML is rendered on
      # demand: an image that carries a name is an image one customer owns.
      # BRAND_NAME also goes to the API above; the rest are the browser app's
      # alone, because they only describe what a person looks at.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      # The icon a tab and a home screen use. Empty keeps the icons the image
      # was built with — see .env.example for why the maskable one is separate.
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      BRAND_MASKABLE_ICON_URL: ${BRAND_MASKABLE_ICON_URL:-}
      # Wording this deployment says differently — see .env.example. The path is
      # inside the container: put the file in ./brand beside this compose file
      # and name it BRAND_COPY_FILE=/brand/copy.json. The inline form needs no
      # file and suits an override of a line or two.
      BRAND_COPY_FILE: ${BRAND_COPY_FILE:-}
      BRAND_COPY: ${BRAND_COPY:-}
      # Where this deployment's manual lives — the landing page's last menu
      # item. Empty keeps the platform's own, which is the right answer only
      # while a deployment has not written one.
      BRAND_DOCS_URL: ${BRAND_DOCS_URL:-}
      # Which sections the landing page is built from, in order. Empty renders
      # all of them, which is what every deployment did before this existed.
      # See frontend/lib/landing.ts for the names.
      LANDING_SECTIONS: ${LANDING_SECTIONS:-}
    volumes:
      # Mounted always and usually empty. Copy is configuration a person edits,
      # so it must not need an image rebuild — and it is not something the app
      # has any reason to write, hence read-only. A deployment with nothing to
      # override sets no BRAND_COPY_FILE and nothing here is ever opened.
      - ./brand:/brand:ro
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3008}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # `name` pins the physical volume, decoupling the data from the deploy
  # directory: Compose otherwise derives a volume name from the project, which
  # comes from the directory, so moving the stack would silently bring Postgres
  # up on an empty data directory — healthy container, initdb, migrations, no
  # tenants. Pinning it is what makes that move safe.
  #
  # The pin was `open-gerege-mn-erp_platform_erp_postgres_data` until
  # 2026-08-08, a name inherited from two rebrands ago. It was renamed to match
  # the container names and the sibling stacks sharing this host
  # (gerege_nexus_*, gerege_sso_*, gerege_salus_*), so that three products no
  # longer carry three unrelated naming schemes for the same kind of thing.
  #
  # That rename was a data migration, not an edit: the stack was stopped, the
  # data copied with
  # `docker run --rm -v old:/from -v new:/to alpine cp -a /from/. /to/`, this
  # field repointed, the stack restarted and row counts verified against a
  # pg_dump taken first. The old volume was kept. Renaming it again costs the
  # same steps — changing this line on its own gives you an empty database.
  postgres_data:
    name: ${POSTGRES_VOLUME:-gerege_nexus_platform_postgres_data}
  catalog_cache:
    name: ${CATALOG_CACHE_VOLUME:-gerege_nexus_catalog_cache}
